# Coloring Book Engine — example configuration
# Copy this file to config.yaml and adjust the values.

# Required: folder containing source photographs
input_folder: ./Photos

# Required: folder where coloring pages will be saved
output_folder: ./coloring_pages

# Style(s) to generate.
# Single style:  classic | detailed | whimsical | stained_glass
# All styles:    all
# Or a list:
#   styles:
#     - classic
#     - whimsical
style: classic

# DALL-E 3 output size: 1024x1024 | 1024x1792 (portrait) | 1792x1024 (landscape)
size: "1024x1792"

# OpenAI API key (or set the OPENAI_API_KEY environment variable)
# openai_api_key: sk-...
