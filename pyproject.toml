[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coloringbook"
version = "3.0.0"
description = "AI-powered conversion of photographs into coloring book illustrations using the OpenAI Responses API with high-fidelity image transformation"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openai>=1.30.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
coloringbook = "coloringbook.cli:main"

[tool.setuptools.packages.find]
include = ["coloringbook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
